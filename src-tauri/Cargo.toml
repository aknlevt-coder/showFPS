[package]
name = "custom-performance-overlay"
version = "0.1.0"
edition = "2021"

[lib]
name = "overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# PawnIO kurulumunu indirmek için; tauri-plugin-updater zaten getiriyor (aynı sürüm, rustls).
reqwest = { version = "0.13", default-features = false }
# reqwest'in rustls'i sağlayıcısız gelir; güncelleyici gibi ring kullanılır (ek bağımlılık yok).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
