# Her push ve pull request'te derleme denetimi: arayüz tür denetimi + derleme, sensör yardımcısı,
# Rust (clippy uyarısız + birim testleri). Kurulum paketi üretmez; o yerelde `npm run release` ile.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Arayüz (tsc + vite)
        run: npm run build

      # Sidecar (lhm-helper) ve kuruluma gömülen PawnIO kurulumu; Rust derlemesi ikisini de ister.
      - name: Sensör yardımcısı
        run: npm run build:helper

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings

      # Görev Zamanlayıcı ve ağ isteyen testler (#[ignore]) burada çalışmaz.
      - name: Birim testleri
        working-directory: src-tauri
        run: cargo test --lib
